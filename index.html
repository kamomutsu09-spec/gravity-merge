<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>重力スワイプ</title>
<style>
  html,body{margin:0;height:100%;background:#12151d;overflow:hidden;overscroll-behavior:none}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hint{position:fixed;bottom:16px;left:0;right:0;text-align:center;color:#fff6;font:14px sans-serif;pointer-events:none;transition:opacity 1s;opacity:0}
  #entry{position:fixed;left:50%;top:calc(50% - 22px);transform:translateX(-50%);display:none;gap:8px;align-items:center;font:15px sans-serif;color:#fff}
  #entry input{width:150px;padding:9px 10px;border-radius:10px;border:2px solid #fff6;background:#ffffff15;color:#fff;font:16px sans-serif;outline:none}
  #entry button{padding:9px 14px;border-radius:10px;border:2px solid #ffd76a;background:#ffd76a33;color:#ffd76a;font:bold 15px sans-serif}
  #entry button:disabled{opacity:.5}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">スワイプした方向が「下」になる / 同じ数字がぶつかると合体 / 増えすぎたら負け</div>
<form id="entry" autocomplete="off"><input id="nm" maxlength="10" placeholder="名前(10文字まで)"><button id="send">登録</button><span id="msg"></span></form>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const { Engine, Bodies, Body, Composite } = Matter;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, dpr, engine, balls, walls;
let gTarget = { x: 0, y: 1 }, gNow = { x: 0, y: 1 };
// 重力の強さ:長くスワイプするほど少し強くなる(1倍〜G_MAX倍)
const G_MAX = 1.5;
let gPow = 1, gPowTarget = 1;

const MAXLV = 14;   // 0始まり。表示は1〜15
const BONUS = 1000000; // 15が3つ繋がって消えたときのボーナス
let S = 1; // 画面サイズに応じた拡大率(400pxの画面を基準に1)
const radiusOf = lv => 16 * S * Math.pow(1.12, lv); // 段階ごとの大きさの差は約12%
const hueOf = lv => lv * 24;

function makeBall(x, y, lv) {
  const b = Bodies.circle(x, y, radiusOf(lv), { restitution: 0.4, friction: 0.1, density: 0.001 });
  b.level = lv;
  balls.push(b); Composite.add(engine.world, b);
  return b;
}

// 降ってくる段階の決め方:正規分布(平均とばらつきが時間で増える)
const SPAWN_CAP = 7; // 降ってくる最大の段階(0始まり。7 = 表示は8)
function gauss() {
  return Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());
}
function pickLevel() {
  const sec = ticks / 60;
  const mean = 0.5 + sec / 30;     // 30秒ごとに平均が1段階上がる
  const sigma = 0.6 + sec / 25;    // ばらつきも広がる
  return Math.max(0, Math.min(SPAWN_CAP, Math.round(mean + gauss() * sigma)));
}

function addBalls(x, y, n) {
  for (let i = 0; i < n; i++) {
    const lv = pickLevel();
    makeBall(x + (Math.random() - 0.5) * 30, y + (Math.random() - 0.5) * 30, lv);
  }
}

// --- ゲーム状態 ---
const LIMIT = 80;      // この数に達した状態が続くと終了
const GRACE = 120;     // 猶予(約2秒 = 120ステップ)
let over, ticks, nextSpawn, full, merges, best, score, bonusT = 0, bonusV = 0;
let hi = 0;
try { hi = +localStorage.getItem('gravHi') || 0; } catch (e) {}

// --- 画面の状態と、ランキング(この端末のみ・上位5件) ---
let mode = 'title'; // 'title' | 'rank' | 'play'
const RANK_N = 5;
let rank = [], lastRank = -1;
try { rank = JSON.parse(localStorage.getItem('gravRank') || '[]'); } catch (e) {}
if (!Array.isArray(rank)) rank = [];
if (!rank.length && hi > 0) rank = [{ s: hi, d: Date.now() }]; // 旧ハイスコアを引き継ぐ
function recordScore() {
  lastRank = -1;
  if (score <= 0) return;
  const mine = { s: score, d: Date.now() };
  rank.push(mine);
  rank.sort((a, b) => b.s - a.s);
  rank = rank.slice(0, RANK_N);
  lastRank = rank.indexOf(mine);
  hi = Math.max(hi, score);
  try {
    localStorage.setItem('gravRank', JSON.stringify(rank));
    localStorage.setItem('gravHi', hi);
  } catch (e) {}
}
const fmtDate = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`; };

// --- みんなのランキング(Supabase)。URL とキーが空なら端末内ランキングだけで動く ---
const SB_URL = 'https://guvfbgzfbqbpfxhwgnqs.supabase.co';
const SB_KEY = 'sb_publishable_D0mz1eZY2hRmtdscJ_BJRQ_mZjG91yG';  // 公開用キー(publishable / anon)。書き込みはDB側のルールで制限している
const online = !!(SB_URL && SB_KEY);
const G_N = 10;
let rankTab = online ? 'global' : 'local', gRank = [], gState = 'idle'; // idle | loading | ok | err
async function loadGlobal() {
  gState = 'loading';
  try {
    const r = await fetch(`${SB_URL}/rest/v1/scores?select=name,score,created_at&order=score.desc&limit=${G_N}`, { headers: { apikey: SB_KEY } });
    if (!r.ok) throw new Error(r.status);
    gRank = await r.json(); gState = 'ok';
  } catch (e) { gState = 'err'; }
}
async function submitScore(name, s) {
  const r = await fetch(`${SB_URL}/rest/v1/scores`, {
    method: 'POST',
    headers: { apikey: SB_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
    body: JSON.stringify({ name, score: s })
  });
  if (!r.ok) throw new Error(r.status);
}
function openRank() {
  mode = 'rank';
  if (online && rankTab === 'global') loadGlobal();
}

// ゲームオーバー時の名前入力欄(HTMLのフォーム)
const entry = document.getElementById('entry'), nm = document.getElementById('nm');
const sendBtn = document.getElementById('send'), msg = document.getElementById('msg');
try { nm.value = localStorage.getItem('gravName') || ''; } catch (e) {}
function showEntry() {
  if (!online || score <= 0) return;
  nm.style.display = sendBtn.style.display = ''; sendBtn.disabled = false; msg.textContent = '';
  entry.style.display = 'flex';
}
function hideEntry() { entry.style.display = 'none'; nm.blur(); }
entry.addEventListener('submit', async e => {
  e.preventDefault();
  const name = nm.value.trim().slice(0, 10);
  if (!name) { msg.textContent = '名前を入れてね'; return; }
  try { localStorage.setItem('gravName', name); } catch (e) {}
  sendBtn.disabled = true; msg.textContent = '送信中…';
  try {
    await submitScore(name, score);
    nm.style.display = sendBtn.style.display = 'none'; nm.blur();
    msg.textContent = 'みんなのランキングに登録しました!';
  } catch (err) {
    sendBtn.disabled = false; msg.textContent = '送信できませんでした';
  }
});

// 画面上のボタン(キャンバスに描いて、タップ位置で判定する)
function buttons() {
  const w = Math.min(240, W * 0.7), h = 48, x = W / 2 - w / 2;
  if (mode === 'title') return [
    { id: 'start', label: 'スタート', x, y: H * 0.5, w, h },
    { id: 'rank', label: 'ランキング', x, y: H * 0.5 + 64, w, h },
    { id: 'help', label: '遊び方', x, y: H * 0.5 + 128, w, h }
  ];
  if (mode === 'help') return [{ id: 'title', label: 'もどる', x, y: helpLayout().backY, w, h }];
  if (mode === 'rank') {
    const L = rankLayout(), list = [];
    if (online) {
      const tw = Math.min(120, W * 0.4);
      list.push({ id: 'tabG', label: 'みんな', x: W / 2 - tw - 4, y: 66, w: tw, h: 36, on: rankTab === 'global' });
      list.push({ id: 'tabL', label: 'この端末', x: W / 2 + 4, y: 66, w: tw, h: 36, on: rankTab === 'local' });
    }
    list.push({ id: 'title', label: 'もどる', x, y: L.backY, w, h });
    return list;
  }
  if (over) {
    const bw = Math.min(150, W * 0.4);
    return [
      { id: 'retry', label: 'もう一度', x: W / 2 - bw - 8, y: H / 2 + 50, w: bw, h },
      { id: 'title', label: 'タイトルへ', x: W / 2 + 8, y: H / 2 + 50, w: bw, h }
    ];
  }
  return [];
}
const setHint = v => { document.getElementById('hint').style.opacity = v; };
// ランキング画面の行の位置(横画面でも収まるように行間を縮める)
function rankLayout() {
  const top = online ? 120 : 76, n = rankTab === 'global' ? G_N : RANK_N;
  const sp = Math.max(18, Math.min(30, (H - top - 70) / n));
  return { top, n, sp, backY: Math.min(top + n * sp + 10, H - 56) };
}
// 遊び方の説明
const HELP = [
  'スワイプした方向が「下」になり、ボールが流れる',
  '長くスワイプするほど、重力が少し強くなる',
  '同じ数字がぶつかると、次の数字に合体(最大15)',
  '大きい数字を作るほど高得点',
  '15が3つくっつくと消えて +1,000,000',
  'ボールが80個以上の状態が2秒続くとゲームオーバー'
];
function helpLayout() {
  const top = 90, sp = Math.max(24, Math.min(40, (H - top - 70) / HELP.length));
  return { top, sp, backY: Math.min(top + HELP.length * sp + 10, H - 56) };
}
function startGame() {
  hideEntry();
  init();
  gTarget = { x: 0, y: 1 }; gNow = { x: 0, y: 1 }; gPow = gPowTarget = 1;
  mode = 'play';
  setHint(1);
}
function press(id) {
  if (id === 'start' || id === 'retry') startGame();
  else if (id === 'rank') openRank();
  else if (id === 'help') mode = 'help';
  else if (id === 'tabG') { rankTab = 'global'; loadGlobal(); }
  else if (id === 'tabL') rankTab = 'local';
  else if (id === 'title') { hideEntry(); mode = 'title'; over = false; }
}

function resetState() {
  over = false; ticks = 0; nextSpawn = 30; full = 0; merges = 0; best = 0; score = 0; bonusT = 0;
}

// 最大段階(15)のボールが3つ以上くっついていたら、まとめて消してボーナス
function checkTriple() {
  const top = balls.filter(b => b.level === MAXLV);
  if (top.length < 3) return;
  const seen = new Set();
  for (const s of top) {
    if (seen.has(s)) continue;
    const comp = [s]; seen.add(s);
    for (let i = 0; i < comp.length; i++) {
      for (const o of top) {
        if (seen.has(o)) continue;
        const d = Math.hypot(comp[i].position.x - o.position.x, comp[i].position.y - o.position.y);
        if (d <= comp[i].circleRadius + o.circleRadius + 2) { seen.add(o); comp.push(o); }
      }
    }
    if (comp.length >= 3) {
      for (const b of comp) Composite.remove(engine.world, b);
      balls = balls.filter(b => !comp.includes(b));
      const v = BONUS * Math.floor(comp.length / 3);
      score += v; bonusV = v; bonusT = 120;
    }
  }
}

function onCollide(ev) {
  const used = new Set();
  for (const p of ev.pairs) {
    const a = p.bodyA, b = p.bodyB;
    if (a.level === undefined || b.level === undefined) continue;
    if (a.level !== b.level || a.level >= MAXLV) continue;
    if (used.has(a) || used.has(b)) continue;
    used.add(a); used.add(b);
    const x = (a.position.x + b.position.x) / 2, y = (a.position.y + b.position.y) / 2;
    const lv = a.level + 1;
    Composite.remove(engine.world, a); Composite.remove(engine.world, b);
    balls = balls.filter(q => q !== a && q !== b);
    const nb = makeBall(x, y, lv);
    nb.pop = 1; // 合体時の演出用
    merges++; best = Math.max(best, lv);
    score += 10 * Math.pow(2, lv); // 大きい数字ほど指数的に高得点
  }
}

// 画面サイズに依存する値(キャンバス・拡大率)を更新する
function layout() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  S = Math.sqrt(W * H) / 570; // 面積基準(縦長のスマホ 390x844 で約1)
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function makeWalls() {
  const t = 60, o = { isStatic: true, restitution: 0.3 };
  return [
    Bodies.rectangle(W / 2, H + t / 2, W * 2, t, o),
    Bodies.rectangle(W / 2, -t / 2, W * 2, t, o),
    Bodies.rectangle(-t / 2, H / 2, t, H * 2, o),
    Bodies.rectangle(W + t / 2, H / 2, t, H * 2, o)
  ];
}

// 画面の向き・サイズが変わっても、ゲームは続行(ボールの位置と大きさを引き継ぐ)
function onResize() {
  if (!engine) return;
  const oW = W, oH = H, oS = S;
  layout();
  Composite.remove(engine.world, walls);
  walls = makeWalls();
  Composite.add(engine.world, walls);
  const k = S / oS;
  for (const b of balls) {
    Body.setPosition(b, { x: b.position.x * W / oW, y: b.position.y * H / oH });
    if (Math.abs(k - 1) > 0.001) Body.scale(b, k, k);
  }
}

function init() {
  layout();
  engine = Engine.create();
  balls = [];
  walls = makeWalls();
  Composite.add(engine.world, walls);
  Matter.Events.on(engine, 'collisionStart', onCollide);
  resetState();
  addBalls(W / 2, H / 3, 15);
}

// --- 入力 ---
let down = null, moved = 0;
cv.addEventListener('pointerdown', e => {
  if (mode !== 'play' || over) {
    const b = buttons().find(b => e.clientX >= b.x && e.clientX <= b.x + b.w && e.clientY >= b.y && e.clientY <= b.y + b.h);
    if (b) press(b.id);
    return;
  }
  down ={ x: e.clientX, y: e.clientY }; moved = 0;
});
cv.addEventListener('pointermove', e => {
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y, d = Math.hypot(dx, dy);
  if (d > 4) {
    moved += d;
    gTarget = { x: dx / d, y: dy / d }; down = { x: e.clientX, y: e.clientY };
    // 画面の短辺の6割ほどスワイプすると最大の強さ
    gPowTarget = 1 + (G_MAX - 1) * Math.min(1, moved / (Math.min(W, H) * 0.6));
  }
  document.getElementById('hint').style.opacity = 0;
});
function end() { down = null; }
cv.addEventListener('pointerup', end);
cv.addEventListener('pointercancel', () => { down = null; });
addEventListener('resize', onResize);

// --- ループ ---
let acc = 0, prev = performance.now();
function loop(now) {
  acc += Math.min(now - prev, 50); prev = now;
  while (acc >= 1000 / 60) {
    if (over || mode !== 'play') { acc = 0; break; }
    ticks++;
    // 自動でボールが降る(時間とともに間隔が短くなる)
    if (ticks >= nextSpawn) {
      addBalls(W * (0.15 + Math.random() * 0.7), H * (0.15 + Math.random() * 0.7), 1);
      nextSpawn = ticks + Math.max(10, 24 - ticks / 60);
    }
    // 満杯の状態が続いたら終了
    full = balls.length >= LIMIT ? full + 1 : 0;
    if (full >= GRACE) {
      over = true;
      recordScore(); setHint(0); showEntry();
    }
    // 重力の向きをなめらかに切り替える
    gNow.x += (gTarget.x - gNow.x) * 0.15;
    gNow.y += (gTarget.y - gNow.y) * 0.15;
    gPow += (gPowTarget - gPow) * 0.15;
    engine.gravity.x = gNow.x * gPow; engine.gravity.y = gNow.y * gPow;
    Engine.update(engine, 1000 / 60);
    checkTriple();
    if (bonusT > 0) bonusT--;
    acc -= 1000 / 60;
  }
  draw();
  requestAnimationFrame(loop);
}

function drawButtons() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 18px sans-serif';
  for (const b of buttons()) {
    ctx.fillStyle = b.on ? '#ffd76a33' : '#ffffff22'; ctx.strokeStyle = b.on ? '#ffd76a' : '#fff6'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 12); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
  }
}

function drawMenu() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
  if (mode === 'title') {
    ctx.font = `bold ${Math.min(40, W * 0.1)}px sans-serif`;
    ctx.fillText('重力スワイプ', W / 2, H * 0.28);
    ctx.font = '15px sans-serif'; ctx.fillStyle = '#fffa';
    ctx.fillText('スワイプで重力を変えて、同じ数字を合体させよう', W / 2, H * 0.28 + 44);
    ctx.fillText(`ハイスコア ${hi}`, W / 2, H * 0.28 + 72);
  } else if (mode === 'help') {
    ctx.font = 'bold 28px sans-serif';
    ctx.fillText('遊び方', W / 2, 40);
    const L = helpLayout();
    ctx.font = `${Math.min(16, L.sp * 0.6)}px sans-serif`;
    HELP.forEach((t, i) => ctx.fillText(t, W / 2, L.top + i * L.sp + L.sp / 2, W - 32));
  } else {
    ctx.font = 'bold 28px sans-serif';
    ctx.fillText('ランキング', W / 2, 40);
    const L = rankLayout(), fs = Math.min(18, L.sp * 0.65);
    const rows = rankTab === 'global'
      ? gRank.map(r => ({ name: r.name, s: r.score, d: Date.parse(r.created_at) }))
      : rank.map(r => ({ name: '', s: r.s, d: r.d }));
    let note = '';
    if (rankTab === 'global' && gState === 'loading') note = '読み込み中…';
    else if (rankTab === 'global' && gState === 'err') note = '読み込めませんでした';
    else if (!rows.length) note = 'まだ記録がありません';
    if (note) { ctx.font = '18px sans-serif'; ctx.fillStyle = '#fff8'; ctx.fillText(note, W / 2, L.top + 30); }
    else rows.forEach((r, i) => {
      const y = L.top + i * L.sp + L.sp / 2;
      ctx.font = `${fs}px sans-serif`;
      ctx.fillStyle = i === 0 ? '#ffd76a' : '#fff';
      ctx.textAlign = 'left'; ctx.fillText(`${i + 1}位`, W / 2 - 150, y);
      ctx.fillText(r.name, W / 2 - 100, y, 110); // 長い名前は横に縮めて収める
      ctx.textAlign = 'right'; ctx.fillText(`${r.s}`, W / 2 + 105, y);
      ctx.fillStyle = '#fff6'; ctx.font = `${fs * 0.8}px sans-serif`; ctx.fillText(fmtDate(r.d), W / 2 + 150, y);
    });
  }
  drawButtons();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  if (mode !== 'play') { drawMenu(); return; }
  for (const b of balls) {
    if (b.pop > 0) b.pop -= 0.08;
    const r = b.circleRadius * (1 + Math.max(b.pop || 0, 0) * 0.25);
    ctx.fillStyle = `hsl(${hueOf(b.level)},75%,60%)`;
    ctx.beginPath(); ctx.arc(b.position.x, b.position.y, r, 0, 7); ctx.fill();
    ctx.fillStyle = '#0008'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `bold ${Math.max(9, r * (b.level >= 9 ? 0.75 : 0.9))}px sans-serif`;
    ctx.fillText(b.level + 1, b.position.x, b.position.y + 1);
  }
  // 重力の向きを示す矢印
  const cx = W / 2, cy = H / 2, L = 40 * gPow; // 矢印の長さで重力の強さを表す
  const m = Math.hypot(gNow.x, gNow.y) || 1, ux = gNow.x / m, uy = gNow.y / m;
  ctx.strokeStyle = '#fff3'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx - ux * L, cy - uy * L); ctx.lineTo(cx + ux * L, cy + uy * L);
  ctx.moveTo(cx + ux * L, cy + uy * L); ctx.lineTo(cx + ux * L - ux * 12 + uy * 8, cy + uy * L - uy * 12 - ux * 8);
  ctx.moveTo(cx + ux * L, cy + uy * L); ctx.lineTo(cx + ux * L - ux * 12 - uy * 8, cy + uy * L - uy * 12 + ux * 8);
  ctx.stroke();

  // HUD
  const warn = balls.length >= LIMIT * 0.8;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = warn ? '#ff6b6b' : '#fffa';
  ctx.fillText(`数 ${balls.length}/${LIMIT}`, 12, 12);
  ctx.fillStyle = '#fffa';
  ctx.textAlign = 'right';
  ctx.fillText(`スコア ${score}`, W - 12, 12);
  ctx.fillText(`最大 ${best + 1} / ハイ ${Math.max(hi, score)}`, W - 12, 34);
  if (full > 0 && !over) {
    ctx.fillStyle = `rgba(255,80,80,${0.15 + 0.15 * Math.sin(full / 4)})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (bonusT > 0 && !over) {
    ctx.fillStyle = `rgba(255,230,120,${Math.min(1, bonusT / 40)})`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 30px sans-serif';
    ctx.fillText(`ボーナス +${bonusV}`, W / 2, H / 3);
  }
  if (over) {
    ctx.fillStyle = '#000d'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 32px sans-serif'; ctx.fillText('ゲームオーバー', W / 2, H / 2 - 110);
    ctx.font = '18px sans-serif';
    ctx.fillText(`スコア ${score}${lastRank === 0 ? '(ハイスコア!)' : ''}`, W / 2, H / 2 - 70);
    if (lastRank >= 0) ctx.fillText(`この端末で ${lastRank + 1}位`, W / 2, H / 2 - 44);
    drawButtons();
  }
}

init();
requestAnimationFrame(loop);
</script>
