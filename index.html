<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta property="og:url" content="https://kamomutsu09-spec.github.io/gravity-merge/">

<style>
  html,body{margin:0;height:100%;background:#12151d;overflow:hidden;overscroll-behavior:none}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hint{position:fixed;bottom:16px;left:0;right:0;text-align:center;color:#fff6;font:14px sans-serif;pointer-events:none;transition:opacity 1s;opacity:0}

  #rename{flex-wrap:wrap;justify-content:center;width:min(340px,calc(100% - 32px))}
  #entry input,#rename input{width:150px;padding:9px 10px;border-radius:10px;border:2px solid #fff6;background:#ffffff15;color:#fff;font:16px sans-serif;outline:none}

<body>
<canvas id="c"></canvas>
<div id="hint"></div>
<form id="entry" autocomplete="off"><input id="nm" maxlength="10" placeholder="名前(10文字まで)"><button id="send">登録</button><span id="msg"></span></form>
<form id="rename" autocomplete="off"><input id="rn" maxlength="10" placeholder="新しい名前(10文字まで)"><button id="rnOk">変更</button><button type="button" id="rnCancel">やめる</button><span id="rnMsg"></span></form>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const { Engine, Bodies, Body, Composite } = Matter;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, dpr, engine, balls, walls;
let gTarget = { x: 0, y: 1 }, gNow = { x: 0, y: 1 };
// 重力の強さ:指を始点から遠くへ動かすほど強くなる(1倍〜G_MAX倍)
const G_MAX = 1.5;
let gPow = 1, gPowTarget = 1;

// --- モード ---
// normal: スコアを稼ぐ / c15: 15を作るまでのタイム(短いほど良い) / zero: 重力なし、スワイプで弾く
const MODES = {
  normal: { label: '通常モード', short: '通常', desc: 'スコアを稼ぐ。15が3つで +1,000,000',
    hint: 'スワイプした方向が「下」になる / 同じ数字がぶつかると合体 / 増えすぎたら負け' },
  c15: { label: '15チャレンジ', short: '15チャレンジ', desc: '15を作るまでのタイムを競う', time: true,
    hint: 'できるだけ早く15を作ろう / 増えすぎたら失敗' },
  zero: { label: 'ゼロ重力', short: 'ゼロ重力', desc: '重力なし。スワイプして離すとボールを弾く',
    hint: '重力なし / スワイプして離すと、その方向にボールを弾く' }
};
const MODE_IDS = ['normal', 'c15', 'zero'];
let gameMode = 'normal'; // 遊んでいるモード
let rankMode = 'normal'; // ランキング画面で見ているモード
const isTime = m => !!MODES[m].time;
const better = (a, b, m) => isTime(m) ? a < b : a > b; // a が b より良い記録か
// ミリ秒 → 「分:秒.1/10秒」
const fmtTime = ms => { const t = Math.round(ms / 100); return `${Math.floor(t / 600)}:${String(Math.floor(t / 10) % 60).padStart(2, '0')}.${t % 10}`; };
const fmtVal = (v, m) => isTime(m) ? fmtTime(v) : String(v);

// --- 効果音と振動(音声ファイルは使わず、Web Audio で合成する) ---
let soundOn = true;
try { soundOn = localStorage.getItem('gravSound') !== '0'; } catch (e) {}
let actx = null;
function audio() {
  if (!soundOn) return null;
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC(); // ブラウザの制限で、最初のタップの中で作る必要がある
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
// 1音鳴らす:周波数 freq、長さ dur 秒、slide を指定すると終わりに向けて音程が変わる
function tone(freq, dur, type = 'sine', vol = 0.12, when = 0, slide = 0) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
function buzz(p) { if (soundOn && navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} }
const chord = (base, steps, gap, type = 'triangle', vol = 0.13) =>
  steps.forEach((s, i) => tone(base * Math.pow(2, s / 12), 0.28, type, vol, i * gap));
let lastMergeSnd = 0;
const sfx = {
  // 合体:数字が大きいほど高い音。連続しすぎないよう間引く
  merge(lv) {
    const now = performance.now(); if (now - lastMergeSnd < 45) return; lastMergeSnd = now;
    tone(220 * Math.pow(2, lv / 4), 0.12, 'triangle', 0.1); buzz(8);
  },
  big() { chord(523, [0, 4, 7, 12], 0.09); buzz([30, 40, 60]); },      // 15ができた
  bonus() { chord(659, [0, 7, 12, 19, 24], 0.07); buzz([40, 30, 40, 30, 80]); }, // 15が3つで消えた
  over() { tone(330, 0.6, 'sawtooth', 0.07, 0, 0.4); buzz(200); },      // ゲームオーバー
  click() { tone(880, 0.05, 'square', 0.04); }
};
function toggleSound() {
  soundOn = !soundOn;
  try { localStorage.setItem('gravSound', soundOn ? '1' : '0'); } catch (e) {}
  if (soundOn) sfx.click();
}

const MAXLV = 14;   // 0始まり。表示は1〜15
const BONUS = 1000000; // 15が3つ繋がって消えたときのボーナス
let S = 1; // 画面サイズに応じた拡大率(400pxの画面を基準に1)
const radiusOf = lv => 16 * S * Math.pow(1.12, lv); // 段階ごとの大きさの差は約12%
const hueOf = lv => lv * 24;

// 物理計算用のボールの形:Matter.js は円を多角形として扱う(標準は最大25角形)。
// 角が多いほど当たり判定が重くなるので12角形にする(見た目は円のまま描く)
const BALL_SIDES = 12;
function makeBall(x, y, lv) {
  const b = Bodies.circle(x, y, radiusOf(lv), {
    restitution: 0.4, friction: 0.1, density: 0.001,
    frictionAir: gameMode === 'zero' ? 0.02 : 0.01 // ゼロ重力では空気抵抗で少しずつ止まる
  }, BALL_SIDES);
  b.level = lv;
  balls.push(b); Composite.add(engine.world, b);
  return b;
}

// 降ってくる段階の決め方:正規分布(平均とばらつきが時間で増える)
const SPAWN_CAP = 7; // 降ってくる最大の段階(0始まり。7 = 表示は8)
function gauss() {
  return Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());
}
function pickLevel() {
  const sec = ticks / 60;
  const mean = 0.5 + sec / 30;     // 30秒ごとに平均が1段階上がる
  const sigma = 0.6 + sec / 25;    // ばらつきも広がる
  return Math.max(0, Math.min(SPAWN_CAP, Math.round(mean + gauss() * sigma)));
}

function addBalls(x, y, n) {
  for (let i = 0; i < n; i++) {
    const b = makeBall(x + (Math.random() - 0.5) * 30, y + (Math.random() - 0.5) * 30, pickLevel());
    // ゼロ重力では止まったままにならないよう、少しだけ動きをつける
    if (gameMode === 'zero') Body.setVelocity(b, { x: (Math.random() - 0.5) * 2 * S, y: (Math.random() - 0.5) * 2 * S });
  }
}

// --- ゲーム状態 ---
const LIMIT = 80;      // この数に達した状態が続くと終了
const GRACE = 120;     // 猶予(約2秒 = 120ステップ)
let over, ticks, nextSpawn, full, merges, best, score, bonusT = 0, bonusV = 0;
let paused = false; // 一時停止中か(止めている間はタイムも進まない)
let result = 0; // 記録する値(ノーマル/ゼロ重力 = スコア、15チャレンジ = タイム[ms])。記録なしは 0
let hi = 0;
try { hi = +localStorage.getItem('gravHi') || 0; } catch (e) {}

// --- 画面の状態 ---
let mode = 'title'; // 'notice' | 'title' | 'rank' | 'help' | 'play'
let peek = false;   // ゲームオーバー後に「画面を見る」で盤面だけを表示中か
let entryWas = 'none'; // 画面を見る前の名前入力欄の表示状態

// ランキング仕様変更のお知らせ(以前から遊んでいる端末に1回だけ表示)
const NOTICE_KEY = 'gravNotice1';
const NOTICE = [
  '1つの端末につき、最高記録1件だけが並ぶようになりました',
  '「今日」のランキングを追加しました',
  '登録する前に、何位になるか確認できます',
  'これまでの記録は、同じ名前ごとにまとめました'
];
try {
  if (!localStorage.getItem(NOTICE_KEY)) {
    const returning = localStorage.getItem('gravHi') || localStorage.getItem('gravRank') || localStorage.getItem('gravName');
    if (returning) mode = 'notice';
    else localStorage.setItem(NOTICE_KEY, '1'); // 初めての人には出さない
  }
} catch (e) {}

// --- この端末のランキング(モードごとに上位5件) ---
const RANK_N = 5;
const rankKey = m => m === 'normal' ? 'gravRank' : 'gravRank_' + m;
const ranks = {};
for (const m of MODE_IDS) {
  let r = [];
  try { r = JSON.parse(localStorage.getItem(rankKey(m)) || '[]'); } catch (e) {}
  ranks[m] = Array.isArray(r) ? r : [];
}
if (!ranks.normal.length && hi > 0) ranks.normal = [{ s: hi, d: Date.now() }]; // 旧ハイスコアを引き継ぐ
const localBest = m => ranks[m].length ? ranks[m][0].s : 0;
let lastRank = -1;
function recordResult() {
  lastRank = -1;
  if (!(result > 0)) return;
  const m = gameMode, me = { s: result, d: Date.now() };
  ranks[m].push(me);
  ranks[m].sort((a, b) => isTime(m) ? a.s - b.s : b.s - a.s);
  ranks[m] = ranks[m].slice(0, RANK_N);
  lastRank = ranks[m].indexOf(me);
  if (m === 'normal') hi = Math.max(hi, result);
  try {
    localStorage.setItem(rankKey(m), JSON.stringify(ranks[m]));
    if (m === 'normal') localStorage.setItem('gravHi', hi);
  } catch (e) {}
}
const fmtDate = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`; };

// --- みんなのランキング(Supabase)。URL とキーが空なら端末内ランキングだけで動く ---
const SB_URL = 'https://guvfbgzfbqbpfxhwgnqs.supabase.co';
const SB_KEY = 'sb_publishable_D0mz1eZY2hRmtdscJ_BJRQ_mZjG91yG';  // 公開用キー(publishable / anon)。書き込みはDB側のルールで制限している
const online = !!(SB_URL && SB_KEY);
const G_N = 10;
// rankTab: 'global'(みんな・全期間) | 'daily'(みんな・今日) | 'local'(この端末)
let rankTab = online ? 'global' : 'local', gRank = [], gState = 'idle'; // idle | loading | ok | err
const isOnlineTab = () => rankTab !== 'local';
// 今日の0時(見ている人の端末の時刻)を、DBで比べられる形式にする
function todayStart() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.toISOString(); }
// 端末ID:この端末(ブラウザ)を表すランダムなID。ランキングは端末ごとの最高記録1件で並ぶ
let deviceId = null;
try { deviceId = localStorage.getItem('gravDevice'); } catch (e) {}
if (!deviceId) {
  deviceId = crypto.randomUUID ? crypto.randomUUID()
    : 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, () => (Math.random() * 16 | 0).toString(16));
  try { localStorage.setItem('gravDevice', deviceId); } catch (e) {}
}
// 失敗したとき、DBが返すエラーの文言(例 'ng name')を取り出して投げる
async function fail(r) {
  let m = String(r.status);
  try { const j = await r.json(); if (j && j.message) m = j.message; } catch (e) {}
  throw new Error(m);
}
// DBが拒否した理由を、画面に出す文に変える
function reasonText(err, fallback) {
  const m = String(err && err.message || '');
  if (m.includes('ng name')) return 'その名前は使えません';
  if (m.includes('too many')) return '少し待ってからもう一度どうぞ';
  if (m.includes('too fast')) return 'この記録は登録できません';
  if (m.includes('scores_name_check') || m.includes('invalid name')) return '名前は1〜10文字にしてね';
  return fallback;
}
// DBの関数(RPC)を呼ぶ
async function rpc(fn, args) {
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args)
  });
  if (!r.ok) await fail(r);
  return r.json();
}
async function loadGlobal() {
  const tab = rankTab, md = rankMode;
  gState = 'loading';
  try {
    const data = await rpc('top_scores', { since: tab === 'daily' ? todayStart() : null, n: G_N, me: deviceId, md });
    if (rankTab !== tab || rankMode !== md) return; // 読み込み中に切り替わったら捨てる
    gRank = data; gState = 'ok';
  } catch (e) { if (rankTab === tab && rankMode === md) gState = 'err'; }
}
async function submitScore(name, v) {
  const r = await fetch(`${SB_URL}/rest/v1/scores`, {
    method: 'POST',
    headers: { apikey: SB_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
    body: JSON.stringify({ name, score: v, device_id: deviceId, mode: gameMode })
  });
  if (!r.ok) await fail(r);
}
function openRank() {
  mode = 'rank';
  if (online && isOnlineTab()) loadGlobal();
}

// ゲームオーバー時の名前入力欄(HTMLのフォーム)
const entry = document.getElementById('entry'), nm = document.getElementById('nm');
const sendBtn = document.getElementById('send'), msg = document.getElementById('msg');
try { nm.value = localStorage.getItem('gravName') || ''; } catch (e) {}
// 自分が登録した記録 { name, s, pos, dpos, best, mode }
// pos = みんなの中、dpos = 今日の中での順位(取れなければ 0)、best = 登録前の自己ベスト(なければ 0)
let mine = null;
// 値 v を登録したら何位か(自己ベストの方が良ければ自己ベストで計算)
// 返り値 { pos, best, above, below } または null(失敗時)
async function rankPreview(v, daily) {
  try { return await rpc('rank_preview', { sc: v, since: daily ? todayStart() : null, me: deviceId, md: gameMode }); }
  catch (e) { return null; }
}
// 登録前のプレビュー:{ loading } または { pos, dpos, best, above, below }
let preview = null;
async function loadPreview(v) {
  preview = { loading: true };
  const [all, day] = await Promise.all([rankPreview(v), rankPreview(v, true)]);
  if (!over || v !== result) return; // 次のゲームが始まっていたら捨てる
  preview = all ? { pos: all.pos, dpos: day ? day.pos : 0, best: all.best || 0, above: all.above, below: all.below } : null;
}
function showEntry() {
  mine = null; preview = null;
  if (!online || !(result > 0)) return;
  loadPreview(result);
  nm.style.display = sendBtn.style.display = ''; sendBtn.disabled = false; msg.textContent = '';
  entry.style.display = 'flex';
}
function hideEntry() { entry.style.display = 'none'; nm.blur(); }
entry.addEventListener('submit', async e => {
  e.preventDefault();
  const name = nm.value.trim().slice(0, 10);
  if (!name) { msg.textContent = '名前を入れてね'; return; }
  try { localStorage.setItem('gravName', name); } catch (e) {}
  sendBtn.disabled = true; msg.textContent = '送信中…';
  try {
    const m = gameMode, v = result;
    const best = preview && !preview.loading ? preview.best : 0; // 登録前の自己ベスト
    await submitScore(name, v);
    nm.style.display = sendBtn.style.display = 'none'; nm.blur();
    msg.textContent = 'みんなのランキングに登録しました!';
    const [all, day] = await Promise.all([rankPreview(v), rankPreview(v, true)]);
    const pos = all ? all.pos : 0, dpos = day ? day.pos : 0;
    mine = { name, s: v, pos, dpos, best, mode: m };
    if (pos) msg.textContent = (best && better(best, v, m) ? `自己ベスト ${fmtVal(best, m)} のまま ` : '登録しました!')
      + `みんなの中で ${pos}位${dpos ? `・今日 ${dpos}位` : ''}`;
  } catch (err) {
    sendBtn.disabled = false; msg.textContent = reasonText(err, '送信できませんでした');
  }
});

// --- 名前の変更(この端末で登録した記録すべての名前を変える) ---
const renameForm = document.getElementById('rename'), rn = document.getElementById('rn');
const rnOk = document.getElementById('rnOk'), rnMsg = document.getElementById('rnMsg');
function openRename() {
  mode = 'rename';
  rn.value = nm.value.trim(); rnMsg.textContent = ''; rnOk.disabled = false;
  renameForm.style.display = 'flex';
}
function closeRename() { renameForm.style.display = 'none'; rn.blur(); }
document.getElementById('rnCancel').addEventListener('click', () => { closeRename(); openRank(); });
renameForm.addEventListener('submit', async e => {
  e.preventDefault();
  const name = rn.value.trim().slice(0, 10);
  if (!name) { rnMsg.textContent = '名前を入れてね'; return; }
  rnOk.disabled = true; rnMsg.textContent = '変更中…';
  try {
    const n = await rpc('rename_me', { me: deviceId, new_name: name });
    nm.value = name; // 次に登録するときの名前もそろえる
    try { localStorage.setItem('gravName', name); } catch (e) {}
    if (mine) mine.name = name;
    if (!n) { rnOk.disabled = false; rnMsg.textContent = 'この端末で登録した記録がまだありません'; return; }
    closeRename(); openRank();
  } catch (err) {
    rnOk.disabled = false; rnMsg.textContent = reasonText(err, '変更できませんでした');
  }
});

// --- 画面上のボタン(キャンバスに描いて、タップ位置で判定する) ---
// モード選択画面の配置(横画面でも収まるように間隔を調整)
function selectLayout() {
  const top = 84, sp = Math.max(70, Math.min(100, (H - top - 76) / MODE_IDS.length));
  return { top, sp, h: Math.min(60, sp - 26), backY: Math.min(top + MODE_IDS.length * sp + 4, H - 56) };
}
function buttons() {
  const w = Math.min(240, W * 0.7), h = 48, x = W / 2 - w / 2;
  const sndBtn = { id: 'snd', label: soundOn ? '音 ON' : '音 OFF', fs: 14 };
  if (mode === 'title') return [
    { id: 'select', label: 'モード選択', x, y: H * 0.5, w, h, on: true },
    { id: 'rank', label: 'ランキング', x, y: H * 0.5 + 64, w, h },
    { id: 'help', label: '遊び方', x, y: H * 0.5 + 128, w, h },
    { ...sndBtn, x: W - 92, y: 12, w: 80, h: 34 }
  ];
  // プレイ中:上の中央に一時停止ボタン。一時停止中はメニュー
  if (mode === 'play' && !over) {
    if (!paused) return [{ id: 'pause', label: 'II', x: W / 2 - 22, y: 8, w: 44, h: 36, fs: 16 }];
    const y0 = H / 2 - 90;
    return [
      { id: 'resume', label: '再開', x, y: y0, w, h, on: true },
      { id: 'retry', label: 'やり直す', x, y: y0 + 60, w, h },
      { id: 'title', label: 'タイトルへ', x, y: y0 + 120, w, h },
      { ...sndBtn, x, y: y0 + 180, w, h }
    ];
  }
  if (mode === 'select') {
    const L = selectLayout(), bw = Math.min(280, W - 48);
    const list = MODE_IDS.map((m, i) => ({ id: 'm_' + m, label: MODES[m].label, x: W / 2 - bw / 2, y: L.top + i * L.sp, w: bw, h: L.h, fs: 20 }));

function resetState() {

// ゲーム終了。ok = 15チャレンジで15を作れたか
function finish(ok) {

  else result = score;

// 最大段階(15)のボールが3つ以上くっついていたら、まとめて消してボーナス
function checkTriple() {
  const top = balls.filter(b => b.level === MAXLV);
  if (top.length < 3) return;
  const seen = new Set();
  for (const s of top) {
    if (seen.has(s)) continue;
    const comp = [s]; seen.add(s);
    for (let i = 0; i < comp.length; i++) {
      for (const o of top) {
        if (seen.has(o)) continue;
        const d = Math.hypot(comp[i].position.x - o.position.x, comp[i].position.y - o.position.y);
        if (d <= comp[i].circleRadius + o.circleRadius + 2) { seen.add(o); comp.push(o); }
      }
    }
    if (comp.length >= 3) {
      for (const b of comp) Composite.remove(engine.world, b);
      balls = balls.filter(b => !comp.includes(b));
      const v = BONUS * Math.floor(comp.length / 3);
      score += v; bonusV = v; bonusT = 120;
      sfx.bonus();
    }
  }
}

function onCollide(ev) {
  const used = new Set();
  for (const p of ev.pairs) {
    const a = p.bodyA, b = p.bodyB;
    if (a.level === undefined || b.level === undefined) continue;
    if (a.level !== b.level || a.level >= MAXLV) continue;
    if (used.has(a) || used.has(b)) continue;
    used.add(a); used.add(b);
    const x = (a.position.x + b.position.x) / 2, y = (a.position.y + b.position.y) / 2;
    const lv = a.level + 1;
    Composite.remove(engine.world, a); Composite.remove(engine.world, b);
    balls = balls.filter(q => q !== a && q !== b);
    const nb = makeBall(x, y, lv);
    nb.pop = 1; // 合体時の演出用
    merges++; best = Math.max(best, lv);
    score += 10 * Math.pow(2, lv); // 大きい数字ほど指数的に高得点
    if (lv === MAXLV) sfx.big(); else sfx.merge(lv);
    if (gameMode === 'c15' && lv === MAXLV) finish(true); // 15ができたらクリア
  }
}

// 画面サイズに依存する値(キャンバス・拡大率)を更新する
function layout() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  S = Math.sqrt(W * H) / 570; // 面積基準(縦長のスマホ 390x844 で約1)
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sprites = {}; // 大きさが変わったので、ボールの絵を作り直す
}

function makeWalls() {
  const t = 60, o = { isStatic: true, restitution: 0.3 };
  return [
    Bodies.rectangle(W / 2, H + t / 2, W * 2, t, o),
    Bodies.rectangle(W / 2, -t / 2, W * 2, t, o),
    Bodies.rectangle(-t / 2, H / 2, t, H * 2, o),
    Bodies.rectangle(W + t / 2, H / 2, t, H * 2, o)
  ];
}

// 画面の向き・サイズが変わっても、ゲームは続行(ボールの位置と大きさを引き継ぐ)
function onResize() {
  if (!engine) return;
  const oW = W, oH = H, oS = S;
  layout();
  Composite.remove(engine.world, walls);
  walls = makeWalls();
  Composite.add(engine.world, walls);
  const k = S / oS;
  for (const b of balls) {
    Body.setPosition(b, { x: b.position.x * W / oW, y: b.position.y * H / oH });
    if (Math.abs(k - 1) > 0.001) Body.scale(b, k, k);
  }
}

function init() {
  layout();
  engine = Engine.create();
  balls = [];
  walls = makeWalls();
  Composite.add(engine.world, walls);
  Matter.Events.on(engine, 'collisionStart', onCollide);
  resetState();
  addBalls(W / 2, H / 3, 15);
}

// ゼロ重力:指を離した瞬間に、すべてのボールをスワイプの方向へ弾く
function flick(e) {
  const dx = e.clientX - down.x, dy = e.clientY - down.y, d = Math.hypot(dx, dy);
  if (d <= 8) return;
  const t = Math.min(1, d / (Math.min(W, H) * 0.6)), sp = (3 + 9 * t) * S, ux = dx / d, uy = dy / d;
  for (const b of balls) Body.setVelocity(b, { x: b.velocity.x + ux * sp, y: b.velocity.y + uy * sp });
}

// --- ループ ---
// 物理は1秒に60回(固定)。画面の書き換えとは別に数える
const STEP = 1000 / 60, MAX_STEPS = 2;
let acc = 0, prev = performance.now();
function loop(now) {
  acc += Math.min(now - prev, 50); prev = now;
  let steps = 0;
  while (acc >= STEP) {
    if (over || paused || mode !== 'play') { acc = 0; break; }
    // 1コマで追いつくのは2回まで。それ以上の遅れは捨てる(遅れを取り戻そうとして、さらに重くなるのを防ぐ)
    if (steps >= MAX_STEPS) { acc = 0; break; }
    steps++;
    ticks++;
    for (const b of balls) if (b.pop > 0) b.pop -= 0.08; // 合体演出の縮み(画面の速さに左右されないよう、ここで進める)
    // 自動でボールが降る(時間とともに間隔が短くなる)
    if (ticks >= nextSpawn) {
      addBalls(W * (0.15 + Math.random() * 0.7), H * (0.15 + Math.random() * 0.7), 1);
      const sec = ticks / 60;
      let iv = Math.max(10, 24 - sec); // 降る間隔(ステップ数)。約14秒で10まで縮む
      // ゼロ重力は14秒を過ぎても縮み続ける(44秒で5、74秒で約3.3、下限3)
      if (gameMode === 'zero' && sec > 14) iv = Math.max(3, 10 / (1 + (sec - 14) / 30));
      nextSpawn = ticks + iv;
    }
    // 満杯の状態が続いたら終了
    full = balls.length >= LIMIT ? full + 1 : 0;
    if (full >= GRACE) finish(false);
    // 重力の向きをなめらかに切り替える(ゼロ重力では矢印の表示にだけ使う)
    gNow.x += (gTarget.x - gNow.x) * 0.15;
    gNow.y += (gTarget.y - gNow.y) * 0.15;
    gPow += (gPowTarget - gPow) * 0.15;
    if (gameMode === 'zero') { engine.gravity.x = 0; engine.gravity.y = 0; }
    else { engine.gravity.x = gNow.x * gPow; engine.gravity.y = gNow.y * gPow; }
    Engine.update(engine, STEP);
    if (gameMode === 'normal' || gameMode === 'zero') checkTriple();
    if (bonusT > 0) bonusT--;
    acc -= STEP;
  }
  // プレイ中は、物理が進んだコマだけ書き換える(120Hzの画面で同じ絵を2回描かない)。
  // メニュー・一時停止・結果画面・案内表示中は毎コマ描く
  if (steps > 0 || mode !== 'play' || over || paused || tutorial || down) draw();
  requestAnimationFrame(loop);
}

function drawButtons() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const b of buttons()) {
    ctx.fillStyle = b.on ? '#ffd76a33' : '#ffffff22'; ctx.strokeStyle = b.on ? '#ffd76a' : '#fff6'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 12); ctx.fill(); ctx.stroke();
    ctx.font = `bold ${b.fs || 18}px sans-serif`;
    ctx.fillStyle = '#fff'; ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1, b.w - 8);
  }
}

// ボールの絵を数字ごとに1回だけ作っておき、毎コマはそれを貼るだけにする(円と文字を毎回描くより軽い)
// 合体演出で1.25倍まで大きくなるので、その大きさでもぼやけない解像度で作る
let sprites = {};
function ballSprite(lv) {
  if (sprites[lv]) return sprites[lv];
  const R = radiusOf(lv) * 1.25 * dpr, size = Math.ceil(R * 2) + 2;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), m = size / 2;
  g.fillStyle = `hsl(${hueOf(lv)},75%,60%)`;
  g.beginPath(); g.arc(m, m, R, 0, 7); g.fill();
  g.fillStyle = '#0008'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = `bold ${Math.max(9 * dpr, R * (lv >= 9 ? 0.75 : 0.9))}px sans-serif`;
  g.fillText(lv + 1, m, m + R * 0.04);
  return (sprites[lv] = c);
}

// 初回の案内:指(白い丸)が左から右へスワイプする動きを繰り返し見せる
function drawTutorial() {
  const p = (performance.now() % 1600) / 1600, e = Math.min(1, p / 0.7), ease = e * (2 - e);
  const y = H * 0.36, x0 = W / 2 - 80, x = x0 + 160 * ease;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  // 説明文(読みやすいよう背景付き)
  const t1 = gameMode === 'zero' ? 'スワイプして指を離すと' : '画面をスワイプしてみよう';
  const t2 = gameMode === 'zero' ? 'その方向にボールが弾ける' : 'スワイプした方向が「下」になる';
  ctx.font = 'bold 17px sans-serif';
  const tw = Math.max(ctx.measureText(t1).width, ctx.measureText(t2).width) + 32;
  ctx.fillStyle = '#000a'; ctx.beginPath(); ctx.roundRect(W / 2 - tw / 2, y - 92, tw, 60, 14); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillText(t1, W / 2, y - 73);
  ctx.font = '14px sans-serif'; ctx.fillStyle = '#fffc'; ctx.fillText(t2, W / 2, y - 50);
  // 指の軌跡と指
  ctx.globalAlpha = p < 0.85 ? 1 : (1 - p) / 0.15;
  ctx.strokeStyle = '#ffd76a99'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x, y); ctx.stroke();
  ctx.fillStyle = '#fffe'; ctx.beginPath(); ctx.arc(x, y, 16, 0, 7); ctx.fill();
  ctx.strokeStyle = '#ffd76a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 22, 0, 7); ctx.stroke();
  ctx.globalAlpha = 1;
}

// 結果画面の下に、登録した場合の順位と前後の記録を出す
function drawPreview() {
  const y0 = H / 2 + 176, m = gameMode; // シェアボタンの段の下
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 16px sans-serif';
  if (preview.loading) { ctx.fillStyle = '#fff8'; ctx.fillText('みんなの中での順位を確認中…', W / 2, y0); return; }
  const p = preview.pos;
  const keep = preview.best && better(preview.best, result, m); // 自己ベストに届かず、順位は自己ベストのまま
  const day = preview.dpos ? `・今日 ${preview.dpos}位` : '';
  ctx.fillStyle = '#ffd76a';
  ctx.fillText(keep ? `自己ベスト ${fmtVal(preview.best, m)} で みんなの中で ${p}位のまま${day}`
                    : `登録すると みんなの中で ${p}位${day}`, W / 2, y0, W - 32);
  if (H < 600) return; // 横画面など高さが足りないときは1行だけ
  const rows = [];
  if (preview.above) rows.push({ rank: p - 1, name: preview.above.name, s: preview.above.score });
  rows.push({ rank: p, name: nm.value.trim() || 'あなた', s: keep ? preview.best : result, me: true });
  if (preview.below) rows.push({ rank: p + 1, name: preview.below.name, s: preview.below.score });
  ctx.font = '15px sans-serif';
  rows.forEach((r, i) => {
    const y = y0 + 30 + i * 24;
    if (r.me) { ctx.fillStyle = '#ffd76a30'; ctx.fillRect(W / 2 - 158, y - 11, 316, 22); }
    ctx.fillStyle = r.me ? '#ffd76a' : '#fffa';
    ctx.textAlign = 'left'; ctx.fillText(`${r.rank}位`, W / 2 - 150, y);
    ctx.fillText(r.name, W / 2 - 100, y, 110);
    ctx.textAlign = 'right'; ctx.fillText(fmtVal(r.s, m), W / 2 + 105, y);
  });
}

function drawMenu() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
  if (mode === 'notice') {
    ctx.font = 'bold 24px sans-serif'; ctx.fillStyle = '#ffd76a';
    ctx.fillText('お知らせ', W / 2, H * 0.25 - 10);
    ctx.font = 'bold 18px sans-serif'; ctx.fillStyle = '#fff';
    ctx.fillText('ランキングが新しくなりました', W / 2, H * 0.25 + 26, W - 32);
    ctx.font = '15px sans-serif'; ctx.fillStyle = '#fffc';
    NOTICE.forEach((t, i) => ctx.fillText('・' + t, W / 2, H * 0.25 + 66 + i * 32, W - 32));
  } else if (mode === 'title') {
    ctx.font = `bold ${Math.min(40, W * 0.1)}px sans-serif`;
    ctx.fillText('重力スワイプ', W / 2, H * 0.28);
    ctx.font = '15px sans-serif'; ctx.fillStyle = '#fffa';
    ctx.fillText('スワイプで重力を変えて、同じ数字を合体させよう', W / 2, H * 0.28 + 44, W - 32);
  } else if (mode === 'select') {
    ctx.font = 'bold 26px sans-serif';
    ctx.fillText('モード選択', W / 2, 42);
    // 各モードの説明と、この端末での自己ベスト
    ctx.font = '13px sans-serif'; ctx.fillStyle = '#fffa';
    buttons().filter(b => b.id.startsWith('m_')).forEach(b => {
      const m = b.id.slice(2), v = localBest(m);
      const rec = v ? `${isTime(m) ? 'ベスト' : '最高'} ${fmtVal(v, m)}` : '記録なし';
      ctx.fillText(`${MODES[m].desc} ・ ${rec}`, W / 2, b.y + b.h + 13, W - 32);
    });
  } else if (mode === 'rename') {
    ctx.font = 'bold 26px sans-serif';
    ctx.fillText('名前の変更', W / 2, H / 2 - 110);
    ctx.font = '14px sans-serif'; ctx.fillStyle = '#fffa';
    ctx.fillText('この端末で登録した記録すべて(全モード)の', W / 2, H / 2 - 70, W - 32);
    ctx.fillText('名前が変わります', W / 2, H / 2 - 50, W - 32);
  } else if (mode === 'help') {
    ctx.font = 'bold 28px sans-serif';
    ctx.fillText('遊び方', W / 2, 40);
    const L = helpLayout();
    ctx.font = `${Math.min(16, L.sp * 0.6)}px sans-serif`;
    HELP.forEach((t, i) => ctx.fillText(t, W / 2, L.top + i * L.sp + L.sp / 2, W - 32));
  } else {
    ctx.font = 'bold 26px sans-serif';
    ctx.fillText('ランキング', W / 2, 32);
    const L = rankLayout(), fs = Math.min(18, L.sp * 0.65), m = rankMode;
    const net = isOnlineTab();
    const rows = (net
      ? gRank.map(r => ({ name: r.name, s: r.score, d: Date.parse(r.created_at), me: r.mine }))
      : ranks[m].map(r => ({ name: '', s: r.s, d: r.d }))).slice(0, L.n);
    let note = '';
    if (net && gState === 'loading') note = '読み込み中…';
    else if (net && gState === 'err') note = '読み込めませんでした';
    else if (!rows.length) note = rankTab === 'daily' ? '今日の記録はまだありません' : 'まだ記録がありません';
    if (note) { ctx.font = '18px sans-serif'; ctx.fillStyle = '#fff8'; ctx.fillText(note, W / 2, L.top + 30); }
    // この端末の記録は、DBが返す mine フラグで強調する。圏外なら今回の順位をリストの下に出す
    const myIdx = net ? rows.findIndex(r => r.me) : -1;
    const myPos = mine && mine.mode === m ? (rankTab === 'daily' ? mine.dpos : mine.pos) : 0;
    if (!note && net && myPos && myIdx < 0) {
      ctx.textAlign = 'center'; ctx.font = `${fs}px sans-serif`; ctx.fillStyle = '#ffd76a';
      ctx.fillText(`あなた: ${myPos}位`, W / 2, L.noteY);
    }
    if (!note) rows.forEach((r, i) => {
      const y = L.top + i * L.sp + L.sp / 2;
      if (i === myIdx) { ctx.fillStyle = '#ffd76a30'; ctx.fillRect(W / 2 - 158, y - L.sp / 2 + 1, 316, L.sp - 2); }
      ctx.font = `${fs}px sans-serif`;
      ctx.fillStyle = i === 0 ? '#ffd76a' : '#fff';
      ctx.textAlign = 'left'; ctx.fillText(`${i + 1}位`, W / 2 - 150, y);
      ctx.fillText(r.name, W / 2 - 100, y, 110); // 長い名前は横に縮めて収める
      ctx.textAlign = 'right'; ctx.fillText(fmtVal(r.s, m), W / 2 + 105, y);
      ctx.fillStyle = '#fff6'; ctx.font = `${fs * 0.8}px sans-serif`; ctx.fillText(fmtDate(r.d), W / 2 + 150, y);
    });
  }
  drawButtons();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  if (mode !== 'play') { drawMenu(); return; }
  for (const b of balls) {
    const r = b.circleRadius * (1 + Math.max(b.pop || 0, 0) * 0.25);
    ctx.drawImage(ballSprite(b.level), b.position.x - r, b.position.y - r, r * 2, r * 2);
  }
  // 重力の向きを示す矢印(ゼロ重力では、スワイプ中だけ弾く向きと強さを表示)
  if (gameMode !== 'zero' || down) {
    // 強さ(1〜G_MAX)を 0〜1 にして、矢印の長さ・太さ・濃さに反映
    const t = Math.max(0, Math.min(1, (gPow - 1) / (G_MAX - 1)));
    const cx = W / 2, cy = H / 2, L = (25 + 40 * t) * S; // 半分の長さ。全長は弱い時50px〜強い時130px(標準画面)
    const m = Math.hypot(gNow.x, gNow.y) || 1, ux = gNow.x / m, uy = gNow.y / m;
    ctx.strokeStyle = `rgba(255,255,255,${0.2 + 0.25 * t})`; ctx.lineWidth = 3 + 2 * t; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx - ux * L, cy - uy * L); ctx.lineTo(cx + ux * L, cy + uy * L);
    ctx.moveTo(cx + ux * L, cy + uy * L); ctx.lineTo(cx + ux * L - ux * 12 + uy * 8, cy + uy * L - uy * 12 - ux * 8);
    ctx.moveTo(cx + ux * L, cy + uy * L); ctx.lineTo(cx + ux * L - ux * 12 - uy * 8, cy + uy * L - uy * 12 + ux * 8);
    ctx.stroke();
  }

  // HUD
  const warn = balls.length >= LIMIT * 0.8;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = warn ? '#ff6b6b' : '#fffa';
  ctx.fillText(`数 ${balls.length}/${LIMIT}`, 12, 12);
  ctx.fillStyle = '#fff6'; ctx.font = 'bold 13px sans-serif';
  ctx.fillText(MODES[gameMode].label, 12, 34);
  ctx.fillStyle = '#fffa'; ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'right';
  if (isTime(gameMode)) {
    const b = localBest(gameMode);
    ctx.fillText(`タイム ${fmtTime(ticks * 1000 / 60)}`, W - 12, 12);
    ctx.fillText(`最大 ${best + 1} / ベスト ${b ? fmtTime(b) : '-'}`, W - 12, 34);
  } else {
    ctx.fillText(`スコア ${score}`, W - 12, 12);
    ctx.fillText(`最大 ${best + 1} / ハイ ${Math.max(localBest(gameMode), score)}`, W - 12, 34);
  }
  if (full > 0 && !over) {
    ctx.fillStyle = `rgba(255,80,80,${0.15 + 0.15 * Math.sin(full / 4)})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (bonusT > 0 && !over) {
    ctx.fillStyle = `rgba(255,230,120,${Math.min(1, bonusT / 40)})`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 30px sans-serif';
    ctx.fillText(`ボーナス +${bonusV}`, W / 2, H / 3);
  }
  if (!over && !paused && tutorial) drawTutorial();
  if (!over && paused) {
    ctx.fillStyle = '#000c'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 28px sans-serif'; ctx.fillStyle = '#fff';
    ctx.fillText('一時停止', W / 2, H / 2 - 140);
  }
  if (!over) drawButtons(); // 一時停止ボタン、または一時停止メニュー
  if (over && peek) {
    // 最後の盤面をそのまま見せ、戻り方だけ出す
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 15px sans-serif';
    const t = 'タップで結果画面に戻る', tw = ctx.measureText(t).width + 28;
    const ty = gNow.y < -0.5 ? H - 52 : 58; // ボールが溜まる側(重力の向き)と反対に出す
    ctx.fillStyle = '#000b'; ctx.beginPath(); ctx.roundRect(W / 2 - tw / 2, ty, tw, 34, 17); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(t, W / 2, ty + 17);
  } else if (over) {
    // 結果画面
    let head = 'ゲームオーバー', line = `スコア ${score}${lastRank === 0 ? '(ハイスコア!)' : ''}`, gold = false;
    if (gameMode === 'c15') {
      if (result > 0) { head = '15達成!'; gold = true; line = `タイム ${fmtTime(result)}${lastRank === 0 ? '(自己ベスト!)' : ''}`; }
      else { head = 'しっぱい…'; line = `15まで届きませんでした(最大 ${best + 1})`; }
    }
    ctx.fillStyle = '#000d'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 14px sans-serif'; ctx.fillStyle = '#fff8';
    ctx.fillText(MODES[gameMode].label, W / 2, H / 2 - 142);
    ctx.font = 'bold 32px sans-serif'; ctx.fillStyle = gold ? '#ffd76a' : '#fff';
    ctx.fillText(head, W / 2, H / 2 - 110);
    ctx.font = '18px sans-serif'; ctx.fillStyle = '#fff';
    ctx.fillText(line, W / 2, H / 2 - 70, W - 32);
    if (lastRank >= 0) ctx.fillText(`この端末で ${lastRank + 1}位`, W / 2, H / 2 - 44);
    drawButtons();
    if (!mine && preview) drawPreview();
  }
}

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
